name: 校验 V1.10 规则生成器与审计工具

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - 'sources_v110.json'
      - '.github/workflows/update-v110.yml'
      - '.github/workflows/validate-v110.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出 PR 代码
        uses: actions/checkout@v5
      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 运行离线回归测试
        run: python -m unittest discover -s tests -v
      - name: 离线校验现有冲突报告
        run: |
          python scripts/conflict_review_v110.py --summary reports/v1.10/summary.json --out-dir "${RUNNER_TEMP}/qx-v110-review"
          python -c "import json, os, pathlib; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'qx-v110-review/conflict_review.json'; d=json.loads(p.read_text(encoding='utf-8')); assert d['summary']['跨策略重叠记录数'] >= 0"

      - name: 使用完整 V1.10 已发布规则验证 V1.10.2 分析器
        run: |
          python scripts/analyze_rules_v1102.py \
            --before rules/v1.10/BeforeTikTok.list \
            --after rules/v1.10/AfterTikTok.list \
            --report "${RUNNER_TEMP}/qx-v1102-analysis"
          python -c "import json,os,pathlib; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'qx-v1102-analysis/priority_audit.json'; a=json.loads(p.read_text(encoding='utf-8')); assert a['rule_count'] > 1000; assert a['domain_candidates'] >= 0"

      - name: 保存 V1.10.2 完整规则分析报告供下载
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qx-v1102-pr-analysis-${{ github.run_number }}
          path: ${{ runner.temp }}/qx-v1102-analysis/
          retention-days: 7
          if-no-files-found: warn
