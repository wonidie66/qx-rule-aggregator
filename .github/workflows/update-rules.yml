name: 更新 Quantumult X 聚合规则

on:
  workflow_dispatch:
    inputs:
      approve_routing_changes:
        description: '已人工检查更新差异，允许较大变动或首选策略变化（不会放行明显危险规则）'
        type: boolean
        required: false
        default: false
  schedule:
    # 北京时间11:17；日期1、4、7……号执行，并非严格每72小时。
    - cron: '17 3 */3 * *'

permissions:
  contents: write

# 避免本工作流不同运行实例同时写入仓库；不能阻止其他人工提交。
concurrency:
  group: qx-rule-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出仓库最新 main 分支
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 执行离线单元测试
        run: python -m unittest discover -s tests -v

      - name: 下载并聚合公开规则
        run: python scripts/aggregate.py --manifest sources.json --out-dir rules --report reports

      - name: 发布前核验和新旧版本回归检查
        env:
          APPROVE_CHANGES: ${{ inputs.approve_routing_changes || 'false' }}
        run: |
          if [ "$APPROVE_CHANGES" = 'true' ]; then
            python scripts/audit_rules.py --approve-changes
          else
            python scripts/audit_rules.py
          fi

      - name: 保留本次报告供失败排查
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qx-rule-audit-${{ github.run_number }}
          path: |
            reports/
            rules/BeforeTikTok.list
            rules/AfterTikTok.list
          retention-days: 7
          if-no-files-found: warn

      - name: 提交通过审计的规则及报告
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rules/BeforeTikTok.list rules/AfterTikTok.list reports/README.md reports/summary.json reports/conflicts.csv reports/audit.md
          if git diff --cached --quiet; then
            echo '上游没有需要发布的变化'
          else
            # 先保存构建时基线，避免在聚合期间修改了源清单/脚本却发布旧生成结果。
            BASE_SHA="$(git rev-parse HEAD)"
            git commit -m 'chore: 经审计更新 Quantumult X 聚合规则'
            git fetch origin main
            # 远端如果已经修改了聚合输入或审计代码，安全停止，改为基于最新版本重跑。
            if ! git diff --quiet "$BASE_SHA" origin/main -- sources.json scripts/ tests/ config/ .github/workflows/update-rules.yml; then
              echo '::error::构建期间聚合代码或清单已更新，请在 Actions 中新建运行（不要重跑旧 SHA）。'
              exit 1
            fi
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo '::error::无法自动整合远端提交；已停止推送以保护远端内容。请新建运行。'
              exit 1
            fi
            # 即使发生竞态也不会强行覆盖远端分支。
            git push origin HEAD:main
          fi
