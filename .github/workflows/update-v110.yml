name: 更新 Quantumult X V1.10 扩展规则（测试）

on:
  workflow_dispatch:
    inputs:
      approve_routing_changes:
        description: '人工核对规则变化后放行一般策略变化（极宽范围规则仍拒绝）'
        type: boolean
        default: false
        required: false

permissions:
  contents: write

concurrency:
  group: qx-rule-v110-update
  cancel-in-progress: false

jobs:
  update_v110:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出最新 main 分支
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 运行现有及 V1.10 测试
        run: python -m unittest discover -s tests -v
      - name: 聚合 V1.10 公开规则
        run: python scripts/aggregate.py --manifest sources_v110.json --out-dir rules/v1.10 --report reports/v1.10 --display-version V1.10
      - name: V1.10 安全审计
        env:
          APPROVE_CHANGES: ${{ inputs.approve_routing_changes || 'false' }}
        run: |
          if [ "$APPROVE_CHANGES" = 'true' ]; then
            python scripts/audit_rules_v110.py --out-dir rules/v1.10 --report reports/v1.10 --policy-file config/policies_v110.json --head-rule-prefix rules/v1.10 --head-report-prefix reports/v1.10 --report-version V1.10 --approve-changes
          else
            python scripts/audit_rules_v110.py --out-dir rules/v1.10 --report reports/v1.10 --policy-file config/policies_v110.json --head-rule-prefix rules/v1.10 --head-report-prefix reports/v1.10 --report-version V1.10
          fi
      - name: 保留审计报告和规则文件
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qx-v110-audit-${{ github.run_number }}
          path: |
            reports/v1.10/
            rules/v1.10/
          retention-days: 7
          if-no-files-found: warn
      - name: 安全发布 V1.10
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rules/v1.10/ reports/v1.10/
          if git diff --cached --quiet; then
            echo 'V1.10 无内容变化，无需重复提交'
          else
            BASE_SHA="$(git rev-parse HEAD)"
            git commit -m 'chore: 发布 V1.10 扩展分类规则'
            git fetch origin main
            if ! git diff --quiet "$BASE_SHA" origin/main -- sources_v110.json sources_v19.json scripts/ tests/ config/ .github/workflows/update-v110.yml; then
              echo '::error::规则构建期间源码或策略发生变化，请重新发起运行'
              exit 1
            fi
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo '::error::无法安全合并新提交，请重新发起运行'
              exit 1
            fi
            git push origin HEAD:main
          fi
