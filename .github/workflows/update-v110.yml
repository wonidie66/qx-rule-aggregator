name: 更新 Quantumult X V1.10 扩展规则（稳定）

on:
  workflow_dispatch:
    inputs:
      approve_routing_changes:
        description: '人工核对规则变化后放行一般策略变化（极宽范围规则仍拒绝）'
        type: boolean
        default: false
        required: false

  push:
    branches: [main]
    paths:
      - 'scripts/analyze_rules_v1102.py'
      - 'tests/test_rule_analysis_v1102.py'
      - '.github/workflows/update-v110.yml'
  schedule:
    # 北京时间11:17，每月约每3天运行一次；月末并非严格72小时。
    - cron: '17 3 */3 * *'

permissions:
  contents: write

concurrency:
  group: qx-rule-v110-update
  cancel-in-progress: false

jobs:
  update_v110:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出最新 main 分支
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 运行现有及稳定性测试
        run: python -m unittest discover -s tests -v
      - name: 聚合 V1.10 公开规则
        run: python scripts/aggregate.py --manifest sources_v110.json --out-dir rules/v1.10 --report reports/v1.10 --display-version V1.10
      - name: 生成可复核的策略重叠分类报告（不修改分流）
        run: python scripts/conflict_review_v110.py --summary reports/v1.10/summary.json --out-dir reports/v1.10
      - name: V1.10.2 静态覆盖分析（仅报告，不新增发布阻断）
        continue-on-error: true
        run: |
          python scripts/analyze_rules_v1102.py \
            --before rules/v1.10/BeforeTikTok.list \
            --after rules/v1.10/AfterTikTok.list \
            --report reports/v1.10
      - name: V1.10 安全审计
        env:
          APPROVE_CHANGES: ${{ inputs.approve_routing_changes || 'false' }}
        run: |
          if [ "$APPROVE_CHANGES" = 'true' ]; then
            python scripts/audit_rules_v110.py --out-dir rules/v1.10 --report reports/v1.10 --policy-file config/policies_v110.json --head-rule-prefix rules/v1.10 --head-report-prefix reports/v1.10 --report-version V1.10 --approve-changes
          else
            python scripts/audit_rules_v110.py --out-dir rules/v1.10 --report reports/v1.10 --policy-file config/policies_v110.json --head-rule-prefix rules/v1.10 --head-report-prefix reports/v1.10 --report-version V1.10
          fi
      - name: 保留审计报告和规则文件
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qx-v110-audit-${{ github.run_number }}
          path: |
            reports/v1.10/
            rules/v1.10/
          retention-days: 7
          if-no-files-found: warn
      - name: 安全发布 V1.10
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rules/v1.10/ reports/v1.10/
          if git diff --cached --quiet; then
            echo 'V1.10 规则及报告没有内容变化，不创建无意义提交'
          else
            BASE_SHA="$(git rev-parse HEAD)"
            git commit -m 'chore: 经审计发布 V1.10 规则与冲突分类报告'
            git fetch origin main
            if ! git diff --quiet "$BASE_SHA" origin/main -- sources_v110.json sources_v19.json scripts/ tests/ config/ .github/workflows/update-v110.yml; then
              echo '::error::规则构建期间源码或策略发生变化，请重新发起运行'
              exit 1
            fi
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo '::error::无法安全合并新提交，请重新发起运行'
              exit 1
            fi
            git push origin HEAD:main
          fi
