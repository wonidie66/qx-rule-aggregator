# Quantumult X V1.9 测试版（2026-10-10）
# 目标：进一步扩展分流并优化 TikTok 国内使用的路由；保持自动/手动策略、广告过滤和资源解析器。
# 使用前请在 [server_remote] 中填写自己的机场订阅地址。
# 安全提示：本文件含有 MITM 私有证书数据，切勿公开分享。
# 本地私有版原样保留 MITM 私有证书相关字段；TikTok 默认使用分流，不启用过时的换区重写。
# 节点排序限制：原生 available 组不能保证严格按照家宽、直连、家宽直连及倍率顺序选取节点。
# available 会选择候选列表中第一个可用节点，因此机场订阅原有排序会影响结果。
# 严格的多维节点排序仍需要独立订阅预处理器，本版暂未实现。

# 提示：V1.9 首次启用前，先在 GitHub Actions 生成 V1.9 文件，再导入本配置。
# 不要将本文件上传公开 GitHub：此文件保留个人 MITM 私钥。

[general]
server_check_url = http://cp.cloudflare.com/generate_204
server_check_timeout = 5000
# 资源解析器：仅对需要格式转换的资源单独设置 opt-parser=true。
resource_parser_url = https://cdn.jsdelivr.net/gh/KOP-XIAO/QuantumultX@master/Scripts/resource-parser.js
# 如有需要，可自行保留原配置中其他已验证有效的通用设置。

[dns]
# DNS 采用相对保守的设置，如遇解析问题可根据实际网络调整。
server = 223.5.5.5
server = 119.29.29.29

[server_remote]
# 需要操作：将下方示例订阅地址替换为真实地址，并删除行首的分号以启用。
# 订阅链接和令牌均属于敏感信息，请勿公开；多个机场每条订阅单独占一行。
;https://YOUR-PRIVATE-AIRPORT-SUBSCRIPTION.example/sub, tag=机场A, update-interval=86400, enabled=true
;https://YOUR-SECOND-PRIVATE-AIRPORT.example/sub, tag=机场B, update-interval=86400, enabled=true

[server_local]
# 如需使用个人 VPS 节点，可在此添加本地节点配置，请勿泄露登录凭据。

[policy]
# 节点-自动优选：仅在本策略组中排除订阅余量、到期时间等信息节点，不删除原始节点。
# 延迟切换容差为 100 毫秒，尽量避免因小幅延迟差异而频繁更换节点。
# 避免策略组空闲时主动进行周期性测速，以减少不必要的后台活动。
url-latency-benchmark = 节点-自动优选, server-tag-regex=(?i)^(?!.*(?:剩余|重置|到期|套餐|流量|订阅|官网|公告|有效期|下次重置|客服|traffic|expire|expiry|reset|remaining|balance)).+$, check-interval=3600, alive-checking=false, tolerance=100

# 节点-稳定备用：按照候选顺序选用第一个可用节点，不以最低延迟为目标。
# 同样排除机场信息节点，但不会修改原始订阅或完整节点列表。
available = 节点-稳定备用, server-tag-regex=(?i)^(?!.*(?:剩余|重置|到期|套餐|流量|订阅|官网|公告|有效期|下次重置|客服|traffic|expire|expiry|reset|remaining|balance)).+$

# 节点-手动选择：保留全部已导入节点及机场信息节点，方便查看流量和到期信息。
static = 节点-手动选择, 节点-自动优选, 节点-稳定备用, direct, server-tag-regex=.+

# 地区自动组：识别常见地区名称、旗帜和缩写；缩写使用边界限制以降低误匹配。
# 地区策略组必须有至少一个匹配的订阅节点才能正常使用。
available = 地区-香港, server-tag-regex=(?i)^(?!.*(?:剩余|重置|到期|套餐|流量|订阅|官网|公告|有效期|下次重置|客服|traffic|expire|expiry|reset|remaining|balance)).*(?:香港|港区|🇭🇰|(?<![a-z])HK(?![a-z])|Hong.?Kong)
available = 地区-台湾, server-tag-regex=(?i)^(?!.*(?:剩余|重置|到期|套餐|流量|订阅|官网|公告|有效期|下次重置|客服|traffic|expire|expiry|reset|remaining|balance)).*(?:台湾|台灣|台北|臺北|🇹🇼|(?<![a-z])TW(?![a-z])|Taiwan|Taipei)
available = 地区-日本, server-tag-regex=(?i)^(?!.*(?:剩余|重置|到期|套餐|流量|订阅|官网|公告|有效期|下次重置|客服|traffic|expire|expiry|reset|remaining|balance)).*(?:日本|东京|東京|大阪|🇯🇵|(?<![a-z])JP(?![a-z])|Japan|Tokyo|Osaka)
available = 地区-新加坡, server-tag-regex=(?i)^(?!.*(?:剩余|重置|到期|套餐|流量|订阅|官网|公告|有效期|下次重置|客服|traffic|expire|expiry|reset|remaining|balance)).*(?:新加坡|狮城|獅城|🇸🇬|(?<![a-z])SG(?![a-z])|Singapore)
available = 地区-美国, server-tag-regex=(?i)^(?!.*(?:剩余|重置|到期|套餐|流量|订阅|官网|公告|有效期|下次重置|客服|traffic|expire|expiry|reset|remaining|balance)).*(?:美国|美國|洛杉矶|洛杉磯|纽约|紐約|西雅图|西雅圖|🇺🇸|(?<![a-z])US(?![a-z])|(?<![a-z])USA(?![a-z])|United.?States|Los.?Angeles|New.?York|Seattle)
available = 地区-韩国, server-tag-regex=(?i)^(?!.*(?:剩余|重置|到期|套餐|流量|订阅|官网|公告|有效期|下次重置|客服|traffic|expire|expiry|reset|remaining|balance)).*(?:韩国|韓國|首尔|首爾|🇰🇷|(?<![a-z])KR(?![a-z])|Korea|Seoul)

# 分流-海外通用入口：优先节点-自动优选，遇到分流-特殊网站或异常时可改用节点-稳定备用、节点-手动选择或地区组。
static = 分流-海外通用, 节点-自动优选, 节点-稳定备用, 节点-手动选择, 地区-香港, 地区-台湾, 地区-日本, 地区-新加坡, 地区-美国, 地区-韩国

# 各业务策略组：首次启用时默认使用所列的第一个候选策略。
# AI 服务：默认使用地区-美国；若无可用地区-美国，请切换到其他兼容地区或节点-手动选择。
static = 分流-AI服务, 地区-美国, 地区-新加坡, 节点-自动优选, 节点-手动选择
# YouTube：默认使用节点-自动优选，必要时切换至实测吞吐量更好的地区或节点。
static = 分流-视频直播, 节点-自动优选, 地区-香港, 地区-日本, 地区-新加坡, 地区-美国, 节点-手动选择
# 分流-流媒体解锁：需通过实际播放验证地区解锁效果；默认选择地区-美国组。
static = 分流-流媒体解锁, 地区-美国, 地区-新加坡, 地区-日本, 地区-香港, 节点-手动选择, 节点-自动优选
# 分流-学术科研：部分数据库依赖机构 IP 访问，保留直连策略供节点-手动选择。
static = 分流-学术科研, 节点-自动优选, direct, 节点-手动选择
# 分流-特殊网站：通过本地分流规则指定需要单独控制的网站或 App。
static = 分流-特殊网站, 节点-自动优选, 节点-稳定备用, 节点-手动选择, direct

# 服务专项策略：保留手动切换入口，避免不必要地增加策略组数量。
static = 分流-苹果服务, direct, 分流-海外通用, 节点-手动选择
static = 分流-微软服务, 分流-海外通用, direct, 节点-手动选择
# TikTok：单独指定适用地区节点，降低节点-自动优选到不兼容地区出口的风险。
# 首次默认为地区-日本组，仅表示地区偏好，不保证该地区节点一定能解锁；须用实际 TikTok 访问确认。
# 若默认地区-日本不可用，请节点-手动选择已验证可用的台湾、美国等节点。
static = 分流-TikTok, 地区-日本, 地区-台湾, 地区-美国, 地区-新加坡, 节点-手动选择, 节点-自动优选
static = 分流-游戏平台, 分流-海外通用, direct, 节点-手动选择
# 国际社交：独立节点选择，避免社交 App 与普通网页强制共用出口。
static = 分流-国际社交, 分流-海外通用, 节点-手动选择, 地区-美国, 地区-日本
# 开发平台：GitHub / GitLab / Docker等可手动改用固定线路。
static = 分流-开发平台, 分流-海外通用, 节点-手动选择, direct
# 云办公：云盘与协作服务，默认复用海外通用策略。
static = 分流-云办公, 分流-海外通用, 节点-手动选择, 地区-美国


[filter_remote]
# 广告域名完整版：原配置不变。
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/Advertising/Advertising.list, tag=广告拦截-完整版, force-policy=reject, update-interval=604800, opt-parser=false, enabled=true
# V1.9 全新命名的专项聚合文件：请先在 GitHub Actions 成功生成后启用。
# 两份聚合文件每行自带策略名，禁止在订阅行添加 force-policy。
https://cdn.jsdelivr.net/gh/wonidie66/qx-rule-aggregator@main/rules/v1.9/BeforeTikTok.list, tag=分流聚合-前段V1.9, update-interval=259200, opt-parser=false, enabled=true
# TikTok 单独订阅，保留已通过实测的分流位置与资源来源。
https://cdn.jsdelivr.net/gh/Semporia/TikTok-Unlock@master/Quantumult-X/TikTok.list, tag=TikTok-专项分流, force-policy=分流-TikTok, update-interval=604800, opt-parser=false, enabled=true
https://cdn.jsdelivr.net/gh/wonidie66/qx-rule-aggregator@main/rules/v1.9/AfterTikTok.list, tag=分流聚合-后段V1.9, update-interval=259200, opt-parser=false, enabled=true
FILTER_LAN, tag=局域网直连, force-policy=direct, inserted-resource=true, enabled=true

[filter_local]
# 本地自定义修正规则：建议先查看活动日志确认问题，再按需添加。
# 示例：为特定网站指定“分流-特殊网站”策略组。
;host-suffix, example.com, 分流-特殊网站
# 示例：被误拦截的广告域名可视具体情况设置直连放行。
;host, ad.example.net, direct
# 示例：强制某个海外网站使用分流-海外通用。
;host-suffix, overseas-example.org, 分流-海外通用

# 私有及本地地址直连；不要未经验证就将整个运营商共享地址段 100.64.0.0/10 全部排除。
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 127.0.0.0/8, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 192.168.0.0/16, direct
ip-cidr, 169.254.0.0/16, direct
geoip, cn, direct
final, 分流-海外通用

[rewrite_remote]
# 通用广告重写资源：采用 Advertising 重写文件，规模小于 AdvertisingLite 重写文件。
# 注意：检查 MITM 生效域名与应用功能；如出现页面异常，可先暂停这份远程重写资源排查。
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rewrite/QuantumultX/Advertising/Advertising.conf, tag=通用广告重写, update-interval=604800, enabled=true

[rewrite_local]
# 本地重写：后续可添加经过验证的 App 专项规则；当前不加入未经审查的脚本。

[task_local]
# 定时任务：本版暂不设置定时任务。

[mitm]
# 公共模板不包含任何 MITM 证书或密码。
# 如需使用，请仅在本地从原有私人配置复制证书内容，不要提交到 GitHub。
